name: Deploy Variables Academy to Production Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            PHP=/opt/alt/php84/usr/bin/php
            DEPLOY_PATH=/home/u749963918/domains/variablesacademy.com/public_html

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Starting Deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd $DEPLOY_PATH

            echo "📥 Pulling latest code..."
            git reset --hard
            git clean -fd
            git pull origin master
            echo "✅ $(git log -1 --oneline)"

            echo "📦 Composer..."
            $PHP $(which composer) install --no-dev --optimize-autoloader --no-interaction --no-progress
            echo "✅ Composer done"

            echo "🎨 Building assets..."
            npm ci
            npm run build
            echo "✅ Assets built"

            echo "🧹 Clearing caches..."
            $PHP artisan optimize:clear                   || true
            $PHP artisan permission:cache-reset           || true
            $PHP artisan filament:optimize-clear          || true
            $PHP artisan filament:clear-cached-components || true

            echo "⚡ Migrations..."
            $PHP artisan migrate --force --no-interaction

            echo "🔧 Rebuilding caches..."
            $PHP artisan route:cache
            $PHP artisan view:cache
            $PHP artisan event:cache
            $PHP artisan filament:optimize
            $PHP artisan icons:cache 2>/dev/null || true

            echo "🔁 Restarting queues..."
            $PHP artisan queue:restart || true

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🟢 Deployment completed successfully"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"