name: Deploy Variables Academy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────
      # 1. Checkout code
      # ─────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────
      # 2. Setup Node (CI build)
      # ─────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install & Build Frontend Assets
        run: |
          npm ci
          npm run build

      # ─────────────────────────────
      # 3. Upload built assets (Vite / Laravel Mix)
      # ─────────────────────────────
      - name: Upload Built Assets
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "public/build/"
          target: "/home/u749963918/domains/variablesacademy.com/public_html/public/"
          overwrite: true
          strip_components: 1

      # ─────────────────────────────
      # 4. Deploy Backend via SSH
      # ─────────────────────────────
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 30m
          script: |
            set -e

            PHP=/opt/alt/php84/usr/bin/php
            DEPLOY_PATH=/home/u749963918/domains/variablesacademy.com/public_html

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Starting Deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd $DEPLOY_PATH

            # ─────────────────────────────
            # Pull latest code
            # ─────────────────────────────
            echo "📥 Pulling latest code..."
            git reset --hard
            git clean -fd
            git pull origin master
            echo "✅ Latest commit: $(git log -1 --oneline)"

            # ─────────────────────────────
            # Composer install
            # ─────────────────────────────
            echo "📦 Installing PHP dependencies..."
            $PHP $(which composer) install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --no-progress

            # ─────────────────────────────
            # Laravel optimizations
            # ─────────────────────────────
            echo "🧹 Clearing caches..."
            $PHP artisan optimize:clear || true
            $PHP artisan filament:optimize-clear || true
            $PHP artisan filament:clear-cached-components || true

            # ─────────────────────────────
            # Database migrations
            # ─────────────────────────────
            echo "⚡ Running migrations..."
            $PHP artisan migrate --force --no-interaction

            # ─────────────────────────────
            # Rebuild caches
            # ─────────────────────────────
            echo "🔧 Rebuilding caches..."
            $PHP artisan route:cache || true
            $PHP artisan view:cache || true
            $PHP artisan event:cache || true
            $PHP artisan filament:optimize || true
            $PHP artisan icons:cache || true

            # ─────────────────────────────
            # Restart queue
            # ─────────────────────────────
            echo "🔁 Restarting queue..."
            $PHP artisan queue:restart || true

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🟢 Deployment Completed Successfully"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"